name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android && node scripts/apply-android.mjs
      - name: Pasang keystore (jika secret ada)
        id: ks
        env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/noted.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 kosong: APK debug dibuat. Update antar-versi TIDAK bisa dipasang di atas versi lama."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        working-directory: android
        run: |
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi
      - name: Rapikan nama APK
        run: |
          mkdir -p out
          f=$(find android/app/build/outputs/apk -name '*.apk' | head -n1)
          tag="${GITHUB_REF_NAME}"; [ "${GITHUB_REF_TYPE}" = "tag" ] || tag="build-${{ github.run_number }}"
          cp "$f" "out/noted-${tag}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: noted-apk, path: out/*.apk }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: out/*.apk, generate_release_notes: true }
